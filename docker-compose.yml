
services:

  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: sentiment-api

    ports:
      - "5000:5000"

    networks:
      - sentiment-network


  prometheus:
    image: prom/prometheus:latest

    container_name: sentiment-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - sentiment-api

    networks:
      - sentiment-network


  grafana:
    image: grafana/grafana:latest

    container_name: sentiment-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    networks:
      - sentiment-network


networks:

  sentiment-network:
    driver: bridge